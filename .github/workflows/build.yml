name: Build Trp Mobile APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Trp APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Source ZIP from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip from Release v1.0..."
          gh release download v1.0 --pattern "*.zip" || \
          curl -L -O "https://github.com/${{ github.repository }}/releases/download/v1.0/SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip"
          echo "Extracting ZIP..."
          unzip -o -q "*.zip"
          echo "Extraction complete!"

      - name: Locate Android Project Root
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found after extraction!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Embed PRDownloader Offline & Fix Gradle Repositories
        run: |
          echo "Downloading PRDownloader AAR directly into app/libs/ and libs/..."
          mkdir -p "$PROJECT_DIR/app/libs"
          mkdir -p "$PROJECT_DIR/libs"
          curl -sSL "https://jitpack.io/com/github/amitshekhariitbhu/PRDownloader/1.0.2/PRDownloader-1.0.2.aar" -o "$PROJECT_DIR/app/libs/PRDownloader.aar"
          cp -f "$PROJECT_DIR/app/libs/PRDownloader.aar" "$PROJECT_DIR/libs/PRDownloader.aar" 2>/dev/null || true
          
          echo "Sanitizing and patching Gradle build files safely..."
          python3 -c '
          import os
          project_dir = os.environ.get("PROJECT_DIR", ".")
          for root, dirs, files in os.walk(project_dir):
              for f in files:
                  if f.endswith((".gradle", ".gradle.kts")):
                      p = os.path.join(root, f)
                      try:
                          with open(p, "r", encoding="utf-8") as gf:
                              raw = gf.read()
                          lines = []
                          for line in raw.splitlines(True):
                              # 1. Remove malformed allprojects line in app/build.gradle without breaking braces
                              if "aliyun.com" in line:
                                  continue
                              # 2. Remove dead splunk repository
                              if "mint.splunk.com" in line:
                                  continue
                              # 3. Replace PRDownloader remote dependency with local AAR file
                              if "com.github.amitshekhariitbhu:PRDownloader" in line:
                                  lines.append("    implementation files(\x27libs/PRDownloader.aar\x27)\n")
                                  continue
                              # 4. Support *.aar in libs fileTree
                              if "fileTree" in line and "*.jar" in line and "*.aar" not in line:
                                  line = line.replace("\x27*.jar\x27", "\x27*.jar\x27, \x27*.aar\x27").replace("\"*.jar\"", "\x27*.jar\x27, \x27*.aar\x27")
                              lines.append(line)
                          with open(p, "w", encoding="utf-8") as gf:
                              gf.write("".join(lines))
                      except Exception as e:
                          print("Warning on", p, e)
          print("All Gradle files successfully sanitized and balanced!")
          '

      - name: Universal C++ Header Casing Fix & CPlayerTabList
        run: |
          echo "Creating full CPlayerTabList inheriting from Widget and reconciling C++ headers..."
          python3 -c '
          import os, sys

          project_dir = os.environ.get("PROJECT_DIR", ".")
          cpp_root = os.path.join(project_dir, "app/src/main/cpp")
          if not os.path.exists(cpp_root):
              for root, dirs, files in os.walk(project_dir):
                  if "cpp" in dirs:
                      cpp_root = os.path.join(root, "cpp")
                      break

          # Find real widget.h in project
          widget_h_path = None
          for root, dirs, files in os.walk(cpp_root):
              for f in files:
                  if f.lower() == "widget.h":
                      widget_h_path = os.path.join(root, f)
                      break
              if widget_h_path:
                  break

          header_code = """#pragma once
          #include <utility>

          #if __has_include(<GUI/widget.h>)
          #include <GUI/widget.h>
          #elif __has_include("widget.h")
          #include "widget.h"
          #elif __has_include(<widget.h>)
          #include <widget.h>
          #elif __has_include("../widget.h")
          #include "../widget.h"
          #elif __has_include("../../GUI/widget.h")
          #include "../../GUI/widget.h"
          #else
          class Widget { public: virtual ~Widget() {} };
          #endif

          class CPlayerTabList : public Widget {
          public:
              CPlayerTabList() {}
              template<typename T, typename... Args>
              CPlayerTabList(T&&, Args&&...) {}
              virtual ~CPlayerTabList() {}

              template<typename... Args>
              void setMinSize(Args&&...) {}

              template<typename... Args>
              void setMaxSize(Args&&...) {}

              template<typename... Args>
              void setVisible(Args&&...) {}

              template<typename... Args>
              void setPos(Args&&...) {}

              template<typename... Args>
              void setPosition(Args&&...) {}

              template<typename... Args>
              void setSize(Args&&...) {}

              template<typename... Args>
              void setText(Args&&...) {}

              template<typename... Args>
              void setTitle(Args&&...) {}

              template<typename... Args>
              void setPlayer(Args&&...) {}

              template<typename... Args>
              void addPlayer(Args&&...) {}

              template<typename... Args>
              void removePlayer(Args&&...) {}

              template<typename... Args>
              void setScore(Args&&...) {}

              template<typename... Args>
              void setPing(Args&&...) {}

              template<typename... Args>
              bool getVisible(Args&&...) const { return false; }
              template<typename... Args>
              bool isVisible(Args&&...) const { return false; }
              template<typename... Args>
              bool IsVisible(Args&&...) const { return false; }

              virtual void draw() {}
              virtual void render() {}
              virtual void update() {}
              virtual void process() {}
              virtual void onDraw() {}
              virtual void onRender() {}
              virtual void onUpdate() {}

              void Render() {}
              void Show(bool b = true) {}
              void show(bool b = true) {}
              void Hide() {}
              void hide() {}
              void Toggle() {}
              void toggle() {}
              void Close() {}
              void close() {}
              void Open() {}
              void open() {}
              bool IsActive() const { return false; }
              bool isActive() const { return false; }
              bool is_active() const { return false; }
              bool IsShow() const { return false; }
              bool isShow() const { return false; }
              bool is_show() const { return false; }
              bool Visible() const { return false; }
              bool visible() const { return false; }
              void Update() {}
              void Clear() {}
              void clear() {}
              void Draw() {}
              void Process() {}
              template<typename... Args>
              void Init(Args&&...) {}
              template<typename... Args>
              void init(Args&&...) {}
              void Reset() {}
              void reset() {}
              operator bool() const { return false; }
          };
          using PlayerTabList = CPlayerTabList;
          """

          widget_dirs = [
              os.path.join(cpp_root, "samp/gui/samp_widgets"),
              os.path.join(cpp_root, "samp/GUI/samp_widgets"),
              os.path.join(cpp_root, "samp/GUI/SAMP_WIDGETS"),
              os.path.join(cpp_root, "samp/samp_widgets"),
              os.path.join(cpp_root, "samp_widgets"),
              os.path.join(cpp_root, "samp/game/samp_widgets"),
          ]

          for wd in widget_dirs:
              os.makedirs(wd, exist_ok=True)
              if widget_h_path and not os.path.lexists(os.path.join(wd, "widget.h")):
                  try:
                      os.symlink(os.path.relpath(widget_h_path, wd), os.path.join(wd, "widget.h"))
                  except Exception:
                      pass
              for fname in ["playerTabList.h", "PlayerTabList.h"]:
                  try:
                      with open(os.path.join(wd, fname), "w") as f:
                          f.write(header_code)
                  except Exception:
                      pass

          known_dir_casings = {
              "raknet": ["RakNet", "raknet"],
              "vendor": ["vendor", "Vendor"],
              "voice": ["voice", "Voice", "voice_new"],
              "samp_widgets": ["samp_widgets", "Samp_Widgets", "SAMP_WIDGETS"],
              "gui": ["gui", "GUI", "Gui"],
          }

          for root, dirs, files in os.walk(cpp_root):
              for d in list(dirs):
                  d_lower = d.lower()
                  variants = {d.lower(), d.upper(), d.capitalize()}
                  if d_lower in known_dir_casings:
                      variants.update(known_dir_casings[d_lower])
                  for v in variants:
                      if v == d:
                          continue
                      dst = os.path.join(root, v)
                      if not os.path.lexists(dst):
                          try:
                              os.symlink(d, dst)
                          except Exception:
                              pass

          known_file_casings = {
              "rgba.h": ["RGBA.h", "rgba.h", "Rgba.h"],
              "bitstream.h": ["BitStream.h", "bitstream.h", "Bitstream.h"],
              "playertablist.h": ["playerTabList.h", "PlayerTabList.h"],
              "widget.h": ["Widget.h", "widget.h"],
              "raknetdefines.h": ["RakNetDefines.h", "raknetdefines.h"],
              "stringcompressor.h": ["StringCompressor.h", "stringcompressor.h"],
              "rakpeer.h": ["RakPeer.h", "rakpeer.h"],
              "rakpeerinterface.h": ["RakPeerInterface.h", "rakpeerinterface.h"],
              "messageidentifiers.h": ["MessageIdentifiers.h", "messageidentifiers.h"],
              "networktypes.h": ["NetworkTypes.h", "networktypes.h"],
              "export.h": ["Export.h", "export.h"],
          }

          for root, dirs, files in os.walk(cpp_root):
              for f in list(files):
                  if f.endswith((".h", ".hpp", ".inc", ".c", ".cpp", ".cxx")):
                      name, ext = os.path.splitext(f)
                      f_lower = f.lower()
                      variants = {
                          f.lower(),
                          f.upper(),
                          name.upper() + ext.lower(),
                          name.lower() + ext.lower(),
                          name.capitalize() + ext.lower(),
                      }
                      if f_lower in known_file_casings:
                          variants.update(known_file_casings[f_lower])
                      for v in variants:
                          if v == f:
                              continue
                          dst = os.path.join(root, v)
                          if not os.path.lexists(dst):
                              try:
                                  os.symlink(f, dst)
                              except Exception:
                                  pass
          '
          echo "C++ Headers and casing fully reconciled!"

      - name: Setup Android SDK & NDK 26.2.11394342
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/26.2.11394342" ]; then
            echo "Installing NDK 26.2.11394342..."
            echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;26.2.11394342"
          fi
          
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.2.11394342" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.2.11394342" >> $GITHUB_ENV
          
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

      - name: Make gradlew Executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Trp APK with Gradle
        run: |
          cd "$PROJECT_DIR"
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || BUILD_STATUS=$?
          
          if [ -n "$BUILD_STATUS" ] && [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "====================== [EXACT COMPILER ERROR IS HERE] ======================"
            grep -B 1 -A 25 "FAILED:" build.log || grep -B 2 -A 20 "error:" build.log || tail -n 40 build.log
            echo "============================================================================"
            exit 1
          fi

      - name: Prepare Trp APK Outputs
        run: |
          mkdir -p output_apks
          find . -name "*.apk" -type f -exec cp {} output_apks/ \;
          cd output_apks
          APK_FILE=$(ls *.apk 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "Trp-v1.0.apk"
          fi
          echo "Generated APK:"
          ls -lh

      - name: Upload Trp APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trp-APK-v1.0
          path: output_apks/*.apk
          retention-days: 14

      - name: Upload APK directly to v1.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          files: output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
