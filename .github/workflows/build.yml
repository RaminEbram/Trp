name: Build Trp Mobile APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Trp APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ۱. دریافت اطلاعات مخزن
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۲. دانلود سورس ۱۲۵ مگابایتی از Release v1.0
      - name: Download Source ZIP from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip from Release v1.0..."
          gh release download v1.0 --pattern "*.zip" || \
          curl -L -O "https://github.com/${{ github.repository }}/releases/download/v1.0/SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip"
          
          echo "Extracting ZIP..."
          unzip -o -q "*.zip"
          echo "Extraction complete!"

      # ۳. پیدا کردن پوشه پروژه
      - name: Locate Android Project Root
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found after extraction!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # ۴. تنظیم جاوا روی ۱۷
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ۵. دانلود مستقیم فایل پکیج PRDownloader و تزریق به settings.gradle
      - name: Configure Repositories & Pre-cache PRDownloader
        run: |
          echo "Pre-caching PRDownloader directly from JitPack..."
          M2_DIR="$HOME/.m2/repository/com/github/amitshekhariitbhu/PRDownloader/1.0.1"
          mkdir -p "$M2_DIR"
          curl -sSL "https://jitpack.io/com/github/amitshekhariitbhu/PRDownloader/1.0.1/PRDownloader-1.0.1.aar" -o "$M2_DIR/PRDownloader-1.0.1.aar" || true
          curl -sSL "https://jitpack.io/com/github/amitshekhariitbhu/PRDownloader/1.0.1/PRDownloader-1.0.1.pom" -o "$M2_DIR/PRDownloader-1.0.1.pom" || true
          
          # اصلاح آدرس‌ها
          find "$PROJECT_DIR" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://mint.splunk.com/gradle/|https://jitpack.io/|g' {} +
          find "$PROJECT_DIR" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|http://mint.splunk.com/gradle/|https://jitpack.io/|g' {} +
          
          # افزودن مخزن محلی و JitPack به settings.gradle (محل اصلی مخازن در گریدل ۸)
          if [ -f "$PROJECT_DIR/settings.gradle" ]; then
            sed -i "s|repositories {|repositories {\n        mavenLocal()\n        maven { url 'https://jitpack.io' }|g" "$PROJECT_DIR/settings.gradle"
          fi
          if [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            sed -i 's|repositories {|repositories {\n        mavenLocal()\n        maven("https://jitpack.io")|g' "$PROJECT_DIR/settings.gradle.kts"
          fi
          
          # افزودن به build.gradle
          find "$PROJECT_DIR" -maxdepth 2 -name "build.gradle" -exec sed -i "s|repositories {|repositories {\n        mavenLocal()\n        maven { url 'https://jitpack.io' }|g" {} +
          echo "Settings and repositories updated successfully!"

      # ۶. نصب دقیق نسخه NDK 26.2.11394342
      - name: Setup Android SDK & NDK 26.2.11394342
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/26.2.11394342" ]; then
            echo "Installing NDK 26.2.11394342..."
            echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;26.2.11394342"
          fi
          
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.2.11394342" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.2.11394342" >> $GITHUB_ENV
          
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

      # ۷. صدور مجوز اجرایی به gradlew
      - name: Make gradlew Executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      # ۸. ساخت APK با گریدل
      - name: Build Trp APK with Gradle
        run: |
          cd "$PROJECT_DIR"
          
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || BUILD_STATUS=$?
          
          if [ -n "$BUILD_STATUS" ] && [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "====================== [EXACT ERROR DETAILS] ======================"
            grep -B 2 -A 6 "Could not resolve" build.log || grep -B 1 -A 10 "What went wrong:" build.log || tail -n 25 build.log
            echo "==================================================================="
            exit 1
          fi

      # ۹. جمع‌آوری و تغییر نام به Trp-v1.0.apk
      - name: Prepare Trp APK Outputs
        run: |
          mkdir -p output_apks
          find . -name "*.apk" -type f -exec cp {} output_apks/ \;
          cd output_apks
          APK_FILE=$(ls *.apk 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "Trp-v1.0.apk"
          fi
          echo "Generated APK:"
          ls -lh

      # ۱۰. آپلود به بخش Artifacts
      - name: Upload Trp APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trp-APK-v1.0
          path: output_apks/*.apk
          retention-days: 14

      # ۱۱. الصاق مستقیم به Release v1.0
      - name: Upload APK directly to v1.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          files: output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
