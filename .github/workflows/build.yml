name: Build Trp Mobile APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Trp APK from Release Asset
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ۱. دریافت اطلاعات مخزن
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۲. دانلود سورس ۱۲۵ مگابایتی از Release v1.0 و استخراج آن
      - name: Download Source ZIP from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip from Release v1.0..."
          gh release download v1.0 --pattern "*.zip" || \
          curl -L -O "https://github.com/${{ github.repository }}/releases/download/v1.0/SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip"
          
          echo "Extracting ZIP..."
          unzip -o -q "*.zip"
          echo "Extraction successful!"

      # ۳. پیدا کردن پوشه پروژه اندروید
      - name: Locate Android Project Root
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found after extraction!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # ۴. تنظیم جاوا JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ۵. فعال‌سازی NDK داخلی سرور گیت‌هاب (بدون هیچ افزونه خارجی)
      - name: Configure Built-in Android NDK
        run: |
          echo "Configuring Android NDK..."
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | tail -n 1)
          if [ -n "$NDK_PATH" ]; then
            echo "Using pre-installed NDK at: $NDK_PATH"
            echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          fi
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      # ۶. صدور مجوز اجرایی به gradlew
      - name: Make gradlew Executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      # ۷. کامپایل پروژه با گریدل
      - name: Build Trp APK with Gradle
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      # ۸. جمع‌آوری فایل‌های خروجی و تغییر نام به Trp-v1.0.apk
      - name: Prepare Trp APK Outputs
        run: |
          mkdir -p output_apks
          find . -name "*.apk" -type f -exec cp {} output_apks/ \;
          cd output_apks
          APK_FILE=$(ls *.apk 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "Trp-v1.0.apk"
          fi
          ls -lh

      # ۹. آپلود فایل در بخش Artifacts
      - name: Upload Trp APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trp-APK-v1.0
          path: output_apks/*.apk
          retention-days: 14

      # ۱۰. اضافه کردن فایل نهایی Trp-v1.0.apk به Release v1.0
      - name: Upload APK directly to v1.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          files: output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
