name: Build Trp Mobile APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      direct_zip_url:
        description: 'لینک مستقیم دانلود فایل زیپ سورس (اختیاری)'
        required: false
        default: ''
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Trp (Tehran RP) APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository Trp
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # استخراج زیپ از مخزن یا دانلود مستقیم در صورت دادن لینک
      - name: Locate and Extract Source Code
        run: |
          echo "Checking repository contents..."
          ls -la
          
          if [ -n "${{ github.event.inputs.direct_zip_url }}" ]; then
            echo "Downloading ZIP from URL..."
            curl -L -o source.zip "${{ github.event.inputs.direct_zip_url }}"
            unzip -o -q source.zip
          elif [ -f "SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip" ]; then
            echo "Found SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip, extracting..."
            unzip -o -q "SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip"
          elif ls *.zip 1> /dev/null 2>&1; then
            echo "Found a zip file in repository, extracting..."
            unzip -o -q *.zip
          fi

      # پیدا کردن خودکار مسیر پروژه و فایل gradlew
      - name: Locate Android Project Root
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ ERROR: No Android source files found in the repository!"
            echo "Please upload SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip to repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK & CMake
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          echo "y" | sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Make gradlew Executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Trp APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Trp APK Outputs
        run: |
          mkdir -p output_apks
          find . -name "*.apk" -type f -exec cp {} output_apks/ \;
          cd output_apks
          FIRST_APK=$(ls *.apk 2>/dev/null | head -n 1)
          if [ -n "$FIRST_APK" ]; then
            cp "$FIRST_APK" "Trp-v1.0.apk"
          fi
          ls -lh

      - name: Upload Trp APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trp-APK-v1.0
          path: output_apks/*.apk
          retention-days: 14

      - name: Create GitHub Release v1.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v1.0"
          name: "Trp v1.0 - Tehran RP Mobile APK"
          files: output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
