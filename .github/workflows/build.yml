name: Build Tehran RP APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Clone source code
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/trp-source"

          git clone --depth 1 https://github.com/RaminEbram/Trp.git "$source_dir"

          project_dir="$(find "$source_dir" -type f -name gradlew -printf '%h\n' | head -n 1)"

          test -n "$project_dir"
          test -f "$project_dir/settings.gradle" -o -f "$project_dir/settings.gradle.kts"

          chmod +x "$project_dir/gradlew"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: ${{ steps.source.outputs.project_dir }}/**/*.gradle*

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tehran-RP-debug-apk
          if-no-files-found: error
          path: ${{ steps.source.outputs.project_dir }}/**/build/outputs/apk/debug/*.apk
