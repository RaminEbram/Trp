name: Build Trp Mobile APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Trp APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ۱. دریافت اطلاعات مخزن
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۲. دانلود سورس ۱۲۵ مگابایتی از Release v1.0
      - name: Download Source ZIP from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip from Release v1.0..."
          gh release download v1.0 --pattern "*.zip" || \
          curl -L -O "https://github.com/${{ github.repository }}/releases/download/v1.0/SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip"
          
          echo "Extracting ZIP..."
          unzip -o -q "*.zip"
          echo "Extraction complete!"

      # ۳. پیدا کردن پوشه پروژه
      - name: Locate Android Project Root
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found after extraction!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # ۴. تنظیم جاوا روی نسخه ۱۷ (دقیقاً نسخه مورد نیاز Gradle 8.9)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ۵. تنظیم SDK و شناسایی هوشمند NDK اختصاصی سورس
      - name: Setup Android SDK and Required NDK
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          
          # پیدا کردن نسخه دقیق NDK در سورس
          REQ_NDK=$(grep -rohE "ndkVersion\s*=?\s*['\"][^'\"]+['\"]" "$PROJECT_DIR" 2>/dev/null | head -n 1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\\1/")
          echo "Project requested NDK version: $REQ_NDK"
          
          if [ -n "$REQ_NDK" ]; then
            if [ ! -d "$ANDROID_SDK_ROOT/ndk/$REQ_NDK" ]; then
              echo "Installing requested NDK $REQ_NDK via sdkmanager..."
              yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;$REQ_NDK" || true
            fi
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$REQ_NDK" >> $GITHUB_ENV
          else
            LATEST_NDK=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | tail -n 1)
            echo "Using system NDK: $LATEST_NDK"
            echo "ANDROID_NDK_HOME=$LATEST_NDK" >> $GITHUB_ENV
          fi
          
          # تنظیم فایل local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"
          if [ -n "$ANDROID_NDK_HOME" ]; then
            echo "ndk.dir=$ANDROID_NDK_HOME" >> "$PROJECT_DIR/local.properties"
          fi

      # ۶. صدور مجوز اجرایی
      - name: Make gradlew Executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      # ۷. ساخت APK با گریدل
      - name: Build Trp APK with Gradle
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ۸. جمع‌آوری و تغییر نام به Trp-v1.0.apk
      - name: Prepare Trp APK Outputs
        run: |
          mkdir -p output_apks
          find . -name "*.apk" -type f -exec cp {} output_apks/ \;
          cd output_apks
          APK_FILE=$(ls *.apk 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "Trp-v1.0.apk"
          fi
          echo "Generated APK:"
          ls -lh

      # ۹. ذخیره فایل نصبی در بخش Artifacts
      - name: Upload Trp APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trp-APK-v1.0
          path: output_apks/*.apk
          retention-days: 14

      # ۱۰. الصاق مستقیم فایل Trp-v1.0.apk به صفحه Release v1.0 شما
      - name: Upload APK directly to v1.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          files: output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
