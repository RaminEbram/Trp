name: Build Trp Mobile APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Trp APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ۱. دریافت اطلاعات مخزن
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۲. دانلود سورس ۱۲۵ مگابایتی از Release v1.0 و استخراج آن
      - name: Download Source ZIP from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip from Release v1.0..."
          gh release download v1.0 --pattern "*.zip" || \
          curl -L -O "https://github.com/${{ github.repository }}/releases/download/v1.0/SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip"
          
          echo "Extracting ZIP..."
          unzip -o -q "*.zip"
          echo "Extraction complete!"

      # ۳. پیدا کردن پوشه پروژه اندروید
      - name: Locate Android Project Root
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found after extraction!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # ۴. استفاده از جاوا ۱۱ (نسخه کاملاً هماهنگ با سورس GTA 2.10)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      # ۵. تایید تمام لایسنس‌های اندروید و تنظیمات حافظه
      - name: Configure Android SDK Environment
        run: |
          echo "Accepting Android licenses..."
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          
          mkdir -p "$PROJECT_DIR"
          cat << 'EOF' >> "$PROJECT_DIR/gradle.properties"
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          org.gradle.daemon=false
          systemProp.org.gradle.internal.http.connectionTimeout=180000
          systemProp.org.gradle.internal.http.socketTimeout=180000
          android.useAndroidX=true
          EOF

      # ۶. صدور مجوز اجرا به gradlew
      - name: Make gradlew Executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      # ۷. ساخت APK با گریدل
      - name: Build Trp APK with Gradle
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace --no-daemon

      # ۸. جمع‌آوری و تغییر نام فایل نصبی
      - name: Prepare Trp APK Outputs
        run: |
          mkdir -p output_apks
          find . -name "*.apk" -type f -exec cp {} output_apks/ \;
          cd output_apks
          APK_FILE=$(ls *.apk 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "Trp-v1.0.apk"
          fi
          echo "Generated APK:"
          ls -lh

      # ۹. ذخیره فایل در بخش Artifacts
      - name: Upload Trp APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trp-APK-v1.0
          path: output_apks/*.apk
          retention-days: 14

      # ۱۰. اضافه کردن فایل Trp-v1.0.apk مستقیماً به صفحه Release v1.0
      - name: Upload APK directly to v1.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          files: output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
