name: Build Trp Mobile APK

on:
  push:
    branches:
      - main
      - master
      - GTA-2.10
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      release_tag:
        description: 'Release Tag'
        required: true
        default: 'v1.0'

jobs:
  build:
    name: Build Trp (Tehran RP) APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ۱. دریافت کدهای مخزن Trp
      - name: Checkout Repository Trp
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ۲. استخراج خودکار فایل زیپ سورس کد (SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip)
      - name: Extract Source ZIP Archive if Present
        run: |
          echo "Checking for SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip..."
          if [ -f "SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip" ]; then
            echo "Extracting SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip..."
            unzip -o -q "SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip"
          elif ls *.zip 1> /dev/null 2>&1; then
            echo "Extracting found zip file..."
            unzip -o -q "*.zip"
          else
            echo "Using repository files directly."
          fi

      # ۳. پیدا کردن خودکار مسیر فایل gradlew (در صورت تو در تو بودن پوشه‌ها در زیپ)
      - name: Locate Android Project Root
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found! Checking repository..."
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Detected project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # ۴. نصب جاوا JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ۵. نصب Android NDK و CMake برای کامپایل کدهای C++ و هوک سمپ
      - name: Setup Android NDK & CMake
        uses: android-actions/setup-android@v3

      - name: Install Android NDK (r25c) & CMake (3.22.1)
        run: |
          echo "y" | sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      # ۶. صدور مجوز اجرایی برای gradlew
      - name: Make gradlew Executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      # ۷. ساخت APK پروژه Trp
      - name: Build Trp APK
        run: |
          cd "$PROJECT_DIR"
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            echo "Building Release APK..."
            ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          else
            echo "Building Debug APK..."
            ./gradlew assembleDebug --stacktrace
          fi

      # ۸. جمع‌آوری و تغییر نام فایل نصبی به Trp-v1.0.apk
      - name: Prepare Trp APK Outputs
        run: |
          mkdir -p output_apks
          find . -name "*.apk" -type f -exec cp {} output_apks/ \;
          cd output_apks
          FIRST_APK=$(ls *.apk | head -n 1)
          if [ -n "$FIRST_APK" ]; then
            cp "$FIRST_APK" "Trp-v1.0.apk"
          fi
          echo "Ready APKs:"
          ls -lh

      # ۹. آپلود فایل نصبی به عنوان Artifact در گیت‌هاب
      - name: Upload Trp APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trp-APK-v1.0
          path: output_apks/*.apk
          retention-days: 14

      # ۱۰. ساخت خودکار Release در گیت‌هاب با تگ v1.0 و الصاق فایل نصبی Trp-v1.0.apk
      - name: Create GitHub Release v1.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v1.0' }}
          name: "Trp v1.0 - Tehran RP Mobile APK"
          body: |
            ### 🎮 Trp Mobile APK v1.0 (Tehran RP Shell)
            - **Project**: Trp
            - **Base**: GTA 2.10 (SAMP-Mobile-GTA-2.10_TehranRp_Shell)
            - **Target Path for Data**: `/storage/emulated/0/GTA/`
          files: output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
