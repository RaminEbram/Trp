name: Build Trp Mobile APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Trp APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Source ZIP from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip from Release v1.0..."
          gh release download v1.0 --pattern "*.zip" || \
          curl -L -O "https://github.com/${{ github.repository }}/releases/download/v1.0/SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip"
          echo "Extracting ZIP..."
          unzip -o -q "*.zip"
          echo "Extraction complete!"

      - name: Locate Android Project Root
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found after extraction!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Embed PRDownloader Offline
        run: |
          echo "Downloading PRDownloader.aar directly into app/libs/..."
          mkdir -p "$PROJECT_DIR/app/libs"
          curl -sSL "https://jitpack.io/com/github/amitshekhariitbhu/PRDownloader/1.0.1/PRDownloader-1.0.1.aar" -o "$PROJECT_DIR/app/libs/PRDownloader-1.0.1.aar"
          
          echo "Connecting app/build.gradle to local AAR..."
          sed -i -E "s|['\"]com\\.github\\.amitshekhariitbhu:PRDownloader:[^'\"]+['\"]|files('libs/PRDownloader-1.0.1.aar')|g" "$PROJECT_DIR/app/build.gradle"
          
          find "$PROJECT_DIR" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://mint.splunk.com/gradle/|https://repo1.maven.org/maven2/|g' {} +
          find "$PROJECT_DIR" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|http://mint.splunk.com/gradle/|https://repo1.maven.org/maven2/|g' {} +

      - name: Universal C++ Header Casing Fix & CPlayerTabList
        run: |
          echo "Creating full CPlayerTabList with show(), hide(), toggle(), render()..."
          mkdir -p "$PROJECT_DIR/app/src/main/cpp/samp/gui/samp_widgets"
          mkdir -p "$PROJECT_DIR/app/src/main/cpp/samp/samp_widgets"
          
          printf "#pragma once\nclass CPlayerTabList { public: void Render() {} void render() {} void Show(bool b=true) {} void show(bool b=true) {} void Hide() {} void hide() {} void Toggle() {} void toggle() {} void Close() {} void close() {} void Open() {} void open() {} bool IsActive() const { return false; } bool isActive() const { return false; } bool is_active() const { return false; } bool IsShow() const { return false; } bool isShow() const { return false; } bool is_show() const { return false; } void Update() {} void update() {} void Clear() {} void clear() {} };\nusing PlayerTabList = CPlayerTabList;\n" > "$PROJECT_DIR/app/src/main/cpp/samp/gui/samp_widgets/playerTabList.h"
          cp -f "$PROJECT_DIR/app/src/main/cpp/samp/gui/samp_widgets/playerTabList.h" "$PROJECT_DIR/app/src/main/cpp/samp/samp_widgets/playerTabList.h"
          
          echo "Generating case-insensitive header aliases (RGBA.h, etc.)..."
          python3 - << 'EOF'
          import os

          project_dir = os.environ.get('PROJECT_DIR', '.')
          cpp_root = os.path.join(project_dir, 'app/src/main/cpp')
          if not os.path.exists(cpp_root):
              for root, dirs, files in os.walk(project_dir):
                  if 'cpp' in dirs:
                      cpp_root = os.path.join(root, 'cpp')
                      break

          for root, dirs, files in os.walk(cpp_root):
              for f in list(files):
                  if f.endswith(('.h', '.hpp', '.inc')):
                      name, ext = os.path.splitext(f)
                      variants = {
                          f.lower(),
                          f.upper(),
                          name.upper() + ext.lower(),
                          name.lower() + ext.lower(),
                          name.capitalize() + ext.lower(),
                          name.upper() + ext.upper()
                      }
                      for v in variants:
                          dst = os.path.join(root, v)
                          if not os.path.exists(dst):
                              try:
                                  os.symlink(f, dst)
                              except:
                                  pass
          EOF
          echo "C++ Headers fully reconciled!"

      - name: Setup Android SDK & NDK 26.2.11394342
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/26.2.11394342" ]; then
            echo "Installing NDK 26.2.11394342..."
            echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;26.2.11394342"
          fi
          
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.2.11394342" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.2.11394342" >> $GITHUB_ENV
          
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

      - name: Make gradlew Executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Trp APK with Gradle
        run: |
          cd "$PROJECT_DIR"
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || BUILD_STATUS=$?
          
          if [ -n "$BUILD_STATUS" ] && [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "====================== [EXACT COMPILER ERROR IS HERE] ======================"
            grep -B 1 -A 25 "FAILED:" build.log || grep -B 2 -A 20 "error:" build.log || tail -n 40 build.log
            echo "============================================================================"
            exit 1
          fi

      - name: Prepare Trp APK Outputs
        run: |
          mkdir -p output_apks
          find . -name "*.apk" -type f -exec cp {} output_apks/ \;
          cd output_apks
          APK_FILE=$(ls *.apk 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "Trp-v1.0.apk"
          fi
          echo "Generated APK:"
          ls -lh

      - name: Upload Trp APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trp-APK-v1.0
          path: output_apks/*.apk
          retention-days: 14

      - name: Upload APK directly to v1.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          files: output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
