name: Build Trp Mobile APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Trp APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ۱. دریافت اطلاعات مخزن
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۲. دانلود سورس ۱۲۵ مگابایتی از Release v1.0
      - name: Download Source ZIP from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip from Release v1.0..."
          gh release download v1.0 --pattern "*.zip" || \
          curl -L -O "https://github.com/${{ github.repository }}/releases/download/v1.0/SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip"
          
          echo "Extracting ZIP..."
          unzip -o -q "*.zip"
          echo "Extraction complete!"

      # ۳. پیدا کردن پوشه پروژه
      - name: Locate Android Project Root
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found after extraction!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # ۴. تنظیم جاوا روی ۱۷
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ۵. حذف سرور خاموش شده mint.splunk و فعال‌سازی مخزن JitPack برای PRDownloader
      - name: Fix Repositories & PRDownloader
        run: |
          echo "Fixing repositories in project files..."
          # حذف سرور خاموش شده mint.splunk.com
          find "$PROJECT_DIR" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i '/mint\.splunk/d' {} +
          
          # اضافه کردن مخزن زنده JitPack
          find "$PROJECT_DIR" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|mavenCentral()|mavenCentral()\n        maven { url "https://jitpack.io" }|g' {} +
          echo "Repositories fixed successfully!"

      # ۶. نصب دقیق نسخه NDK 26.2.11394342 مورد نیاز سورس
      - name: Setup Android SDK & NDK 26.2.11394342
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/26.2.11394342" ]; then
            echo "Installing NDK 26.2.11394342..."
            echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;26.2.11394342"
          else
            echo "NDK 26.2.11394342 is already installed!"
          fi
          
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.2.11394342" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.2.11394342" >> $GITHUB_ENV
          
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

      # ۷. صدور مجوز اجرایی به gradlew
      - name: Make gradlew Executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      # ۸. ساخت APK با گریدل
      - name: Build Trp APK with Gradle
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      # ۹. جمع‌آوری و تغییر نام به Trp-v1.0.apk
      - name: Prepare Trp APK Outputs
        run: |
          mkdir -p output_apks
          find . -name "*.apk" -type f -exec cp {} output_apks/ \;
          cd output_apks
          APK_FILE=$(ls *.apk 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "Trp-v1.0.apk"
          fi
          echo "Generated APK:"
          ls -lh

      # ۱۰. ذخیره در بخش Artifacts
      - name: Upload Trp APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trp-APK-v1.0
          path: output_apks/*.apk
          retention-days: 14

      # ۱۱. الصاق مستقیم فایل نهایی Trp-v1.0.apk به صفحه Release v1.0
      - name: Upload APK directly to v1.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          files: output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
