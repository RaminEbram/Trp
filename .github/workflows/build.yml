name: Build Trp Mobile APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Trp APK from Release Asset
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ۱. دریافت اطلاعات مخزن
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۲. دانلود سورس ۱۲۵ مگابایتی از Release v1.0
      - name: Download Source ZIP from GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip from Release v1.0..."
          gh release download v1.0 --pattern "*.zip" || \
          curl -L -O "https://github.com/${{ github.repository }}/releases/download/v1.0/SAMP-Mobile-GTA-2.10_TehranRp_Shell.zip"
          
          echo "Extracting ZIP..."
          unzip -o -q "*.zip"
          echo "Extraction complete!"

      # ۳. پیدا کردن پوشه پروژه
      - name: Locate Android Project Root
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found after extraction!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # ۴. تنظیم جاوا JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ۵. تایید لایسنس‌ها و هماهنگ‌سازی NDK داخلی (جلوگیری از دانلود ۱.۲ گیگابایت و تایم‌اوت)
      - name: Optimize Android SDK & NDK Alignment
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          
          # پیدا کردن NDK موجود روی سرور
          RUNNER_NDK=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | tail -n 1)
          if [ -n "$RUNNER_NDK" ]; then
            NDK_VERSION=$(basename "$RUNNER_NDK")
            echo "Using Runner NDK: $NDK_VERSION"
            echo "ANDROID_NDK_HOME=$RUNNER_NDK" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$RUNNER_NDK" >> $GITHUB_ENV
            
            # اصلاح نسخه در build.gradle برای جلوگیری از دانلود ۱.۲ گیگابایت
            find "$PROJECT_DIR" -name "build.gradle*" -exec sed -i -E "s/ndkVersion\s*=?\s*['\"][^'\"]+['\"]/ndkVersion '$NDK_VERSION'/g" {} +
          fi
          
          # افزایش تایم‌اوت شبکه گریدل به ۳ دقیقه
          mkdir -p "$PROJECT_DIR"
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> "$PROJECT_DIR/gradle.properties"
          echo "systemProp.org.gradle.internal.http.connectionTimeout=180000" >> "$PROJECT_DIR/gradle.properties"
          echo "systemProp.org.gradle.internal.http.socketTimeout=180000" >> "$PROJECT_DIR/gradle.properties"

      # ۶. صدور مجوز اجرایی
      - name: Make gradlew Executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      # ۷. ساخت APK
      - name: Build Trp APK with Gradle
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      # ۸. آماده‌سازی فایل Trp-v1.0.apk
      - name: Prepare Trp APK Outputs
        run: |
          mkdir -p output_apks
          find . -name "*.apk" -type f -exec cp {} output_apks/ \;
          cd output_apks
          APK_FILE=$(ls *.apk 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "Trp-v1.0.apk"
          fi
          echo "Generated APK:"
          ls -lh

      # ۹. آپلود در Artifacts
      - name: Upload Trp APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trp-APK-v1.0
          path: output_apks/*.apk
          retention-days: 14

      # ۱۰. الصاق خودکار به صفحه Release v1.0
      - name: Upload APK directly to v1.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0"
          files: output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
